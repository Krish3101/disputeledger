name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install API dependencies
      run: |
        cd app
        npm ci
    
    - name: Lint API code
      run: |
        cd app
        npm run lint
    
    - name: Run API tests
      run: |
        cd app
        npm test
    
    - name: Install Chaincode dependencies
      run: |
        cd chaincode/complaint-js
        npm ci
    
    - name: Run Chaincode tests
      run: |
        cd chaincode/complaint-js
        npm test
    
    - name: Check code formatting
      run: |
        cd app
        npm run format -- --check
