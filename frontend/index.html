<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Dispute Resolution</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📦 Inter-Organizational Dispute Ledger</h1>

      <div id="notification" class="notification hidden"></div>

      <div id="authPanel" class="auth-panel">
        <div class="auth-inputs">
          <input type="text" id="username" placeholder="Username (e.g., supplier1)" />
          <select id="role" title="Select role for registration">
            <option value="partner">partner (Supply Chain Partner)</option>
            <option value="arbiter">arbiter (Dispute Arbiter)</option>
          </select>
          <button id="btnRegister">Register</button>
          <button id="btnLogin" class="btn-secondary">Login</button>
        </div>
        <small class="auth-hint"
          >Note: Role selection is only required when registering a new identity.</small
        >
        <div id="authError" class="error"></div>
      </div>

      <div id="appPanel" class="hidden">
        <div class="user-bar">
          <span id="loggedInUser"></span>
          <button id="btnLogout" class="btn-danger">Logout</button>
        </div>

        <div class="dispute-grid">
          <div id="raisePanel" class="panel-card">
            <h3>Raise New Dispute</h3>
            <label for="dId">Dispute ID</label>
            <input type="text" id="dId" placeholder="e.g., D-101" />
            <label for="dRef">Order Reference</label>
            <input type="text" id="dRef" placeholder="e.g., PO-5542" />
            <label for="dDesc">Description</label>
            <textarea
              id="dDesc"
              rows="3"
              placeholder="e.g., 5 pallets missing or damaged goods"
            ></textarea>
            <button id="btnRaise" class="btn-primary btn-block">Submit to Ledger</button>
          </div>

          <div id="actionPanel" class="panel-card">
            <h3 id="actionHeading">Add Evidence</h3>
            <label for="actionId">Target Dispute ID</label>
            <input type="text" id="actionId" placeholder="e.g., D-101" />
            <label for="actionNotes" id="actionNotesLabel">Evidence Notes</label>
            <textarea
              id="actionNotes"
              rows="3"
              placeholder="Enter supporting notes or adjudication findings"
            ></textarea>
            <div class="action-btn-group">
              <button id="btnEvidence" class="btn-primary btn-block">Add Evidence</button>
              <button id="btnResolve" class="btn-success btn-block hidden">
                Adjudicate Dispute (Arbiter)
              </button>
            </div>
          </div>
        </div>

        <div class="ledger-header">
          <h3>Active Ledger</h3>
          <button id="btnRefresh" class="btn-secondary">Refresh Ledger</button>
        </div>
        <div id="ledger"></div>
        <div id="paginationPanel" class="pagination-panel hidden">
          <button id="btnPrevPage" class="btn-secondary" disabled>&larr; Previous</button>
          <span id="pageInfo" class="page-info">Page 1</span>
          <button id="btnNextPage" class="btn-secondary" disabled>Next &rarr;</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
