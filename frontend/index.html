<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Management System (v1)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2 { color: #333; }
    .auth-panel, .action-panel { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #0056b3; }
    .complaint-card { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 4px; background: #fff; }
    .status { font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Complaint Management System</h1>
    
    <div id="authSection" class="auth-panel">
      <h2>Register / Login</h2>
      <input type="text" id="userId" placeholder="User ID">
      <select id="role">
        <option value="citizen">Citizen</option>
        <option value="authority">Authority</option>
      </select>
      <button onclick="register()">Register</button>
      <button onclick="login()" style="background: #28a745;">Login</button>
    </div>

    <div id="appSection" class="hidden">
      <div class="auth-panel" style="background: #d4edda; display: flex; justify-content: space-between;">
        <span id="loggedInMsg"></span>
        <button onclick="logout()" style="width: auto; margin: 0; background: #dc3545;">Logout</button>
      </div>

      <div class="action-panel">
        <h2>File a Complaint</h2>
        <input type="text" id="cId" placeholder="Complaint ID (e.g., C001)">
        <input type="text" id="cDesc" placeholder="Description">
        <button onclick="createComplaint()">Submit Complaint</button>
      </div>

      <div class="action-panel">
        <h2>Resolve Complaint (Authority Only)</h2>
        <input type="text" id="rId" placeholder="Complaint ID">
        <input type="text" id="rNote" placeholder="Resolution Note">
        <button onclick="resolveComplaint()">Resolve</button>
      </div>

      <h2>All Complaints</h2>
      <button onclick="loadComplaints()" style="background: #6c757d;">Refresh List</button>
      <div id="complaintsList"></div>
    </div>
  </div>

  <script>
    let token = '';

    async function api(path, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(path, {
        method, headers, body: body ? JSON.stringify(body) : null
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'API Error');
      return data;
    }

    async function register() {
      try {
        await api('/users/register', 'POST', { userId: document.getElementById('userId').value, role: document.getElementById('role').value });
        alert('Registered successfully. Please login.');
      } catch (e) { alert(e.message); }
    }

    async function login() {
      try {
        const userId = document.getElementById('userId').value;
        const data = await api('/users/login', 'POST', { userId });
        token = data.token;
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('loggedInMsg').innerHTML = `Logged in as <strong>${userId}</strong>`;
        loadComplaints();
      } catch (e) { alert(e.message); }
    }

    function logout() {
      token = '';
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }

    async function createComplaint() {
      try {
        await api('/complaints', 'POST', { 
          id: document.getElementById('cId').value, 
          user: document.getElementById('userId').value, 
          description: document.getElementById('cDesc').value 
        });
        alert('Created!');
        loadComplaints();
      } catch (e) { alert(e.message); }
    }

    async function resolveComplaint() {
      try {
        await api(`/complaints/${document.getElementById('rId').value}/resolve`, 'PATCH', { 
          note: document.getElementById('rNote').value 
        });
        alert('Resolved!');
        loadComplaints();
      } catch (e) { alert(e.message); }
    }

    async function loadComplaints() {
      try {
        const data = await api('/complaints');
        const list = document.getElementById('complaintsList');
        list.innerHTML = '';
        data.forEach(c => {
          list.innerHTML += `<div class="complaint-card">
            <strong>ID: ${c.complaintID}</strong> - <span class="status">${c.status}</span><br>
            <em>User: ${c.user}</em><br>
            <p>${c.description}</p>
            ${c.resolutionNote ? `<hr><p><strong>Resolution:</strong> ${c.resolutionNote}</p>` : ''}
          </div>`;
        });
      } catch (e) { alert(e.message); }
    }
  </script>
</body>
</html>
