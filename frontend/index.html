<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Dispute Resolution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Inter-Organizational Dispute Ledger</h1>
        
        <div id="authPanel" class="auth-panel">
            <input type="text" id="username" placeholder="Username (e.g., supplier1)">
            <input type="text" id="role" placeholder="Role (partner or arbiter)" value="partner">
            <button onclick="register()">Register</button>
            <button onclick="login()">Login</button>
            <span id="authError" class="error"></span>
        </div>

        <div id="appPanel" class="hidden">
            <div class="auth-panel" style="justify-content: space-between; background: #d4edda;">
                <span id="loggedInUser"></span>
                <button onclick="logout()">Logout</button>
            </div>

            <div style="display:flex; gap: 20px;">
                <div style="flex: 1;">
                    <h3>Raise New Dispute</h3>
                    <input type="text" id="dId" placeholder="Dispute ID (e.g., D-101)" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="dRef" placeholder="Order Ref (e.g., PO-5542)" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="dDesc" placeholder="Description (e.g., 5 pallets missing)" style="width:100%; margin-bottom:10px;"><br>
                    <button onclick="raiseDispute()" style="width:100%;">Submit to Ledger</button>
                </div>
                <div style="flex: 1;">
                    <h3>Add Evidence / Adjudicate</h3>
                    <input type="text" id="actionId" placeholder="Dispute ID" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="actionNotes" placeholder="Evidence / Resolution Notes" style="width:100%; margin-bottom:10px;"><br>
                    <button id="btnEvidence" onclick="addEvidence()" style="width:48%;">Add Evidence</button>
                    <button id="btnResolve" onclick="resolveDispute()" style="width:48%; background: #28a745;">Adjudicate (Arbiter)</button>
                </div>
            </div>
            <h3 style="margin-top: 30px;">Active Ledger</h3>
            <button onclick="loadDisputes()">Refresh Ledger</button>
            <div id="ledger"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
