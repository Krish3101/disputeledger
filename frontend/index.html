<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Dispute Resolution</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; color: #0056b3; }
        .auth-panel { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        input, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #004494; }
        .dispute-card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 5px; background: #fafafa; }
        .status { font-weight: bold; padding: 3px 8px; border-radius: 12px; font-size: 0.85em; }
        .status.PENDING { background: #ffeeba; color: #856404; }
        .status.RESOLVED { background: #d4edda; color: #155724; }
        .evidence-list { margin-top: 10px; font-size: 0.9em; background: #fff; padding: 10px; border: 1px solid #eee; }
        .hidden { display: none !important; }
        .error { color: #dc3545; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Inter-Organizational Dispute Ledger</h1>
        
        <div id="authPanel" class="auth-panel">
            <input type="text" id="username" placeholder="Username (e.g., supplier1)">
            <input type="text" id="role" placeholder="Role (partner or arbiter)" value="partner">
            <button onclick="register()">Register</button>
            <button onclick="login()">Login</button>
            <span id="authError" class="error"></span>
        </div>

        <div id="appPanel" class="hidden">
            <div class="auth-panel" style="justify-content: space-between; background: #d4edda;">
                <span id="loggedInUser"></span>
                <button onclick="logout()">Logout</button>
            </div>

            <div style="display:flex; gap: 20px;">
                <div style="flex: 1;">
                    <h3>Raise New Dispute</h3>
                    <input type="text" id="dId" placeholder="Dispute ID (e.g., D-101)" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="dRef" placeholder="Order Ref (e.g., PO-5542)" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="dDesc" placeholder="Description (e.g., 5 pallets missing)" style="width:100%; margin-bottom:10px;"><br>
                    <button onclick="raiseDispute()" style="width:100%;">Submit to Ledger</button>
                </div>
                <div style="flex: 1;">
                    <h3>Add Evidence / Adjudicate</h3>
                    <input type="text" id="actionId" placeholder="Dispute ID" style="width:100%; margin-bottom:10px;"><br>
                    <input type="text" id="actionNotes" placeholder="Evidence / Resolution Notes" style="width:100%; margin-bottom:10px;"><br>
                    <button onclick="addEvidence()" style="width:48%;">Add Evidence</button>
                    <button onclick="resolveDispute()" style="width:48%; background: #28a745;">Adjudicate (Arbiter)</button>
                </div>
            </div>

            <h3 style="margin-top: 30px;">Active Ledger</h3>
            <button onclick="loadDisputes()">Refresh Ledger</button>
            <div id="ledger"></div>
        </div>
    </div>

    <script>
        let jwtToken = null;

        async function apiCall(endpoint, method, body) {
            const headers = { 'Content-Type': 'application/json' };
            if (jwtToken) headers['Authorization'] = `Bearer ${jwtToken}`;
            
            const res = await fetch(`/api${endpoint}`, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'API Error');
            return data;
        }

        async function register() {
            try {
                const username = document.getElementById('username').value;
                const role = document.getElementById('role').value;
                await apiCall('/auth/register', 'POST', { username, role });
                alert('Registered! Now please log in.');
            } catch (e) { document.getElementById('authError').innerText = e.message; }
        }

        async function login() {
            try {
                const username = document.getElementById('username').value;
                const data = await apiCall('/auth/login', 'POST', { username });
                jwtToken = data.token;
                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('appPanel').classList.remove('hidden');
                document.getElementById('loggedInUser').innerHTML = `Logged in as: <strong>${data.username}</strong>`;
                loadDisputes();
            } catch (e) { document.getElementById('authError').innerText = e.message; }
        }

        function logout() {
            jwtToken = null;
            document.getElementById('authPanel').classList.remove('hidden');
            document.getElementById('appPanel').classList.add('hidden');
        }

        async function raiseDispute() {
            try {
                await apiCall('/disputes', 'POST', {
                    disputeId: document.getElementById('dId').value,
                    orderReference: document.getElementById('dRef').value,
                    description: document.getElementById('dDesc').value
                });
                loadDisputes();
            } catch (e) { alert(e.message); }
        }

        async function addEvidence() {
            try {
                await apiCall(`/disputes/${document.getElementById('actionId').value}/evidence`, 'PATCH', {
                    notes: document.getElementById('actionNotes').value
                });
                loadDisputes();
            } catch (e) { alert(e.message); }
        }

        async function resolveDispute() {
            try {
                await apiCall(`/disputes/${document.getElementById('actionId').value}/resolve`, 'PATCH', {
                    resolutionNote: document.getElementById('actionNotes').value
                });
                loadDisputes();
            } catch (e) { alert(e.message); }
        }

        async function loadDisputes() {
            try {
                const response = await apiCall('/disputes', 'GET');
                const disputes = response.records || [];
                const ledger = document.getElementById('ledger');
                ledger.innerHTML = '';
                disputes.forEach(d => {
                    const evidenceHtml = d.evidence.map(e => `<li>[${e.submittedBy}] ${e.notes}</li>`).join('');
                    ledger.innerHTML += `
                        <div class="dispute-card">
                            <span class="status ${d.status}">${d.status}</span>
                            <strong>${d.id}</strong> (Order: ${d.orderReference})<br>
                            <em>Raised by: ${d.raisedBy} on ${new Date(d.createdAt).toLocaleString()}</em><br>
                            <p>${d.description}</p>
                            ${evidenceHtml ? `<div class="evidence-list"><strong>Evidence:</strong><ul>${evidenceHtml}</ul></div>` : ''}
                            ${d.status === 'RESOLVED' ? `<div style="margin-top:10px; color:#155724;"><strong>Resolution (${d.resolvedBy}):</strong> ${d.resolutionNote}</div>` : ''}
                        </div>
                    `;
                });
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
